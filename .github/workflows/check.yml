name: Check

on:
  pull_request:
  push:
    branches: [main, master, dev/world-beyond-assistant]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: Project / ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: [format:check, check:schema, check:maa, release:dry-run]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check project structure
        run: node tools/check-project.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: pnpm ${{ matrix.command }}

  python:
    name: Python lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check Agent code
        run: uv run --frozen ruff check .
      - name: Check Agent types
        if: ${{ !cancelled() }}
        run: uv run --frozen pyright
