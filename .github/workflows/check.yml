name: Check

on:
  pull_request:
  push:
    branches: [main, master, dev/world-beyond-assistant]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    name: Project / ${{ matrix.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: [format:check, check:schema, check:maa, release:dry-run]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check project structure
        run: node tools/check-project.mjs
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: pnpm ${{ matrix.command }}
      - name: Show formatting fixes
        if: ${{ failure() && matrix.command == 'format:check' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          import {spawnSync} from "node:child_process";
          import * as prettier from "prettier";
          const result = spawnSync("pnpm", ["exec", "prettier", "--list-different", "."], {encoding: "utf8"});
          if (![0, 1].includes(result.status)) throw new Error(result.stderr);
          for (const path of result.stdout.trim().split("\n").filter(Boolean)) {
            const options = await prettier.resolveConfig(path);
            const content = await prettier.format(readFileSync(path, "utf8"), {...options, filepath: path});
            console.log("FORMAT_FIX " + JSON.stringify({path, content}));
          }
          NODE

  python:
    name: Python lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check Agent code
        run: uv run --frozen ruff check .
      - name: Check Agent types
        if: ${{ !cancelled() }}
        run: uv run --frozen pyright
